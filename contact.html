<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us about anything you want related to NauticMap">
    <title>Contact - NauticApp</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/main.js" defer>
    if (localStorage.getItem('darkmode') === 'active') {
      document.documentElement.classList.add('darkmode');
    }
    </script>
    <style>

    main {
    grid-template-columns: 1fr 1fr;
    align-items: center;
    }

    main iframe {
    width: 100%;
    aspect-ratio: 4 / 3;
    max-width: 45em;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    form.card {
    display: grid;
    background-color: var(--background-light);
    padding: 2em;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    gap: 0.5em;
    width: 70%;
    }

    form.card h3 {
    margin-bottom: 0.5em;
    text-align: center;
    }

    form.card label {
    font-weight: 500;
    color: var(--text);
    }

    form.card input,
    form.card select,
    form.card textarea {
    padding: 0.7em;
    border: 1px solid var(--static7);
    background: var(--background);
    color: var(--text);
    border-radius: 8px;
    font-size: var(--p);
    width: 100%;
    }


    form.card input:focus,
    form.card select:focus,
    form.card textarea:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 5px rgba(0,119,204,0.3);
    }

    form.card button.btn {
    background: var(--linearSecondaryAccent);
    color: var(--background);
    border: none;
    padding: 0.85em;
    border-radius: 8px;
    font-size: var(--p);
    cursor: pointer;
    }

    form.card button.btn:hover {
    background: var(--linearPrimarySecondary)
    }

    @media screen and (min-width: 769px) and (max-width: 1024px) {


    }
    @media screen and (max-width: 768px) {
    main {
    padding: 2em;
    grid-template-columns: 1fr;
    padding-bottom: 4em;
    }

    form.card {
    width: 90%;
    }

    }

    }
    </style>
  </head>

              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
            </button>
          </li>

      </nav>

      <div id="overlay" onClick=openCloseSidebar()></div>

    <!-- MAIN --------------------------------------------------------------->
    <main>
      <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d2872.1669381701836!2d15.917831594498951!3d45.7827375747059!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNDXCsDQ2JzU5LjMiTiAxNcKwNTUnMDQuNiJF!5e1!3m2!1sen!2shr!4v1768411046687!5m2!1sen!2shr" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <form class="card" action="https://formsubmit.co/fdonoval@vvg.hr" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://filipdonoval.github.io/WebAplikacijeProjekt/thankyou.html">
        <h3>Contact Us</h3>
        <label for="firstName">First Name*</label><input id="firstName" name="firstName" class="input" required>
        <label for="lastName">Last Name*</label><input id="lastName" name="lastName" class="input" required>
        <label for="email">Email*</label><input id="email" name="email" type="email" class="input" required>
        <label for="country">Country*</label>
        <select id="country" name="country" required>
          <option value="">Select...</option>
          <option>Croatia</option>
          <option>Slovenia</option>
          <option>Bosnia and Herzegovina</option>
          <option>Serbia</option>
          <option>Germany</option>
        </select>
        <label><input style="width: auto; margin-right: 0.25em;" type="checkbox" id="newsletter" name="newsletter"> I want to receive the newsletter</label>
        <label for="message">Message*</label><textarea id="message" name="message" class="input" required></textarea>
        <button class="btn" type="submit">Send</button>
      </form>
    </main>
