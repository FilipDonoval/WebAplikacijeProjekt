  async function getReleasesNames() {
    //https://api.github.com/repos/FreeCAD/FreeCAD/releases?per_page=2&page=2
    //const response = await fetch('https://api.github.com/repos/FreeCAD/FreeCAD/releases?per_page=5&page=1')
    const response = await fetch('https://api.github.com/repos/FilipDonoval/NauticMap/releases')
    const json = await response.json()

    const releases = []

    for (let i = 0; i < json.length; i++) {
      let date = new Date(json[i].published_at)
      date = date.toLocaleDateString('en-GB').replace(/\//g,".");
      console.log(date)
      //releases.push(json[i].name + ' ' + date + ' | Info: ' + json[i].body)

      const li = document.createElement('li')

      const h2 = document.createElement('h2')
      h2.textContent = json[i].name

      const p1 = document.createElement('p')
      p1.textContent = date

      const p2 = document.createElement('p')
      p2.textContent = json[i].body
      p2.classList.add('details')

      li.appendChild(h2)
      li.appendChild(p1)
      li.appendChild(p2)
      li.classList.add('release-item')

      li.addEventListener('click', () => {
        document.querySelectorAll('.release-item.open').forEach(other => {
          if (other !== li) {
            other.classList.remove('open')
            other.querySelector('.details').style.maxHeight = null;
          }
        })

        li.classList.toggle('open')
        const details = li.querySelector('.details')

        if (li.classList.contains('open')) {
          details.style.maxHeight = details.scrollHeight + 'px'
        } else {
          details.style.maxHeight = null;
        }
      })

      releases.push(li)

    }



    const ul = document.createElement('ul')
    releases.forEach(li => {
      ul.appendChild(li)
    })
    
    document.getElementById('releasesText').appendChild(ul)
