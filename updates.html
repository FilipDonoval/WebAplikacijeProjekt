    <style>
    main {
    gap: 4em;
    }

    #releasesText ul {
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    gap: 2em;
    list-style: none;
    padding: 0;
    margin: 0;
    }

    .release-item {
    flex: 1 1 auto;
    width: 60vw;
    align-self: flex-start;
    border: 1px solid var(--secondary);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    background: var(--background);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    overflow: hidden;
    }

    .release-item:hover {
    box-shadow: 0 6px 18px rgba(0,0,0, 0.1);
    transform: translateY(-2px);
    }

    .release-item h2 {
    text-align: center;
    }

    .release-item p.date {
    text-align: end;
    }

    .release-item p.details {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease;
    margin-top: 0;
    }

    .release-item.open p.details {
    opacity: 1;
    margin-top: 12px;
    }

    #loadMoreButton {
    padding: 0.25em 0.5em;
    border: none;
    background: var(--linearSecondaryAccent);
    color: var(--background);
    font-size: var(--h3);
    border-radius: 0.5em;
    display: inline-block;
    text-align: center;
    z-index: 2;
    }

    #loadMoreButton:hover {
    background: var(--linearPrimarySecondary)
    }

    @media screen and (min-width: 769px) and (max-width: 1024px) {
    .release-item {
    width: 90vw;
    }
    }


    @media screen and (max-width: 768px) {
    main {
    padding: 2em 1em;
    }

    .release-item {
    width: 85vw;
    }

    .release-item p {
    font-size: var(--h5);
    }

    }

    </style>

  <script>
  async function getReleasesNames(curPage) {
    //const response = await fetch('https://api.github.com/repos/FreeCAD/FreeCAD/releases?per_page=2&page=' + curPage)
    const response = await fetch('https://api.github.com/repos/FilipDonoval/NauticMap/releases?per_page=2&page=' + curPage)
    const json = await response.json()

    const releases = []

    for (let i = 0; i < json.length; i++) {
      let date = new Date(json[i].published_at)
      date = date.toLocaleDateString('en-GB').replace(/\//g,".");

      const li = document.createElement('li')

      const h2 = document.createElement('h2')
      h2.textContent = json[i].name

      const p1 = document.createElement('p')
      p1.textContent = date
      p1.classList.add('date')

      const p2 = document.createElement('p')
      p2.textContent = json[i].body
      p2.classList.add('details')

      li.appendChild(h2)
      li.appendChild(p1)
      li.appendChild(p2)
      li.classList.add('release-item')

      li.addEventListener('click', () => {
        document.querySelectorAll('.release-item.open').forEach(other => {
          if (other !== li) {
            other.classList.remove('open')
            other.querySelector('.details').style.maxHeight = null;
          }
        })

        li.classList.toggle('open')
        const details = li.querySelector('.details')

        if (li.classList.contains('open')) {
          details.style.maxHeight = details.scrollHeight + 'px'
          li.scrollIntoView({ behavior: "smooth", block: "center"})

        } else {
          details.style.maxHeight = null;
        }
      })

      releases.push(li)
    }

    return releases
  }


  const ul = document.createElement('ul')
  let currentPage = 1

  async function updateReleases() {
    let releases = await getReleasesNames(currentPage)
    releases.forEach(li => {
      ul.appendChild(li)
    })
    document.getElementById('releasesText').appendChild(ul)

    document.querySelector("footer").scrollIntoView({ behavior: "smooth" });

    currentPage += 1
    releases = await getReleasesNames(currentPage)

    if (releases.length <= 0) {
      document.getElementById('loadMoreButton').style.display = "none"
      document.getElementById('loadedAll').style.display = "block"
    }
  }

  updateReleases(currentPage)
  </script>
