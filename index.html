<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautic Application</title>
    <link rel="stylesheet" href="css/style.css">

  </head>
  <body>
    <!-- HEADER --------------------------------------------------------------->
    <header class="page-header">
      <a href="index.html">NauticApp</a>
      <button class="open-sidebar" onClick=openCloseSidebar()>☰</button>
      <nav id="navbar">
        <ul>
          <li><button class="close-sidebar" onClick=openCloseSidebar() >X</button></li>
          <li><a href="index.html">Home</a></li>
          <li><a href="updates.html">Updates</a></li>
          <li><a href="galery.html">Galery</a></li>
          <li><a href="download.html">Download</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <div id="overlay" onClick=openCloseSidebar()></div>
    </header>


    <!-- MAIN --------------------------------------------------------------->
    <main>
      <section class=title-main>
        <div style="grid-area: box-1; display: flex; flex-direction: column;">
          <h1>Nautic Map</h1>
          <h5>Free and Open Source map for android devices</h5>
        </div>
        <a class="download-button" href="download.html" style="grid-area: box-2">Download</a>
        <img src="img//logo/Logo_Transparent.png" alt="title image" style="grid-area: box-3">
      </section>

      <section class="app_example_grid">
        <h3>Plan custom routes and track your position with GPS tracking</h3>
        <div class="carousel" data-carousel>
            <button class="carousel-button prev" data-carousel-button="prev">🠈</button>
            <button class="carousel-button next" data-carousel-button="next">🠊</button>
          <ul data-slides>
            <li class="slide" data-active><img src="img/app_examples/app_example_1.jpg" alt="app_example_1"></li>
            <li class="slide"><img src="img/app_examples/app_example_2.jpg" alt="app_example_2"></li>
            <li class="slide"><img src="img/app_examples/app_example_3.jpg" alt="app_example_3"></li>
          </ul>
        </div>
      </section>
    </main>


    <!-- FOOTER --------------------------------------------------------------->
    <footer>
      <div>
        <strong>Nautic App</strong>
        <p>Free nautic map</p>
      </div>
      <div>
        <a href="https://github.com/FilipDonoval/NauticMap">GitHub</a>
      </div>
    </footer>
  </body>

  <script>    
  const navbar = document.getElementById("navbar")
  function openCloseSidebar() {
    navbar.classList.toggle("show")
  }

  const button = document.querySelectorAll("[data-carousel-button]")
  button.forEach(button => {
    button.addEventListener("click", () => {
      const offset = button.dataset.carouselButton === "next" ? 1 : -1
      const slides = button.closest("[data-carousel]").querySelector("[data-slides]")

      const activeSlide = slides.querySelector("[data-active]")
      let newIndex = [...slides.children].indexOf(activeSlide) + offset

      if (newIndex < 0) {
        newIndex = slides.children.length - 1
      }
      if (newIndex >= slides.children.length) {
        newIndex = 0
      }

      slides.children[newIndex].dataset.active = true
      delete activeSlide.dataset.active
    })
  })


  </script>

</html>
